<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafer Viewer v61 (Export Anchor)</title>
    <style>
        /* --- 樣式設定 --- */
        :root {
            --bg-body: #f4f4f9; --panel: #fff; --text: #333; --border: #ccc;
            --primary: #007ACC; --accent: #009688; --canvas: #e0e0e0;
        }
        [data-theme="dark"] {
            --bg-body: #1e1e1e; --panel: #2d2d2d; --text: #eee; --border: #444;
            --primary: #4fc3f7; --accent: #80cbc4; --canvas: #121212;
        }
        
        body { font-family: "Segoe UI", sans-serif; background: var(--bg-body); color: var(--text); margin: 0; height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 40px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; font-weight: bold; flex-shrink: 0; justify-content: space-between; }
        .container { display: flex; flex: 1; height: calc(100vh - 40px); overflow: hidden; }
        
        .sidebar { width: 360px; min-width: 360px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 10px; overflow-y: auto; gap: 10px; flex-shrink: 0; z-index: 20; }
        .right-panel { flex: 1; display: flex; flex-direction: column; background: var(--canvas); position: relative; min-width: 0; }
        
        #canvas-wrapper { flex: 1; position: relative; overflow: hidden; cursor: default; width: 100%; height: 100%; }
        canvas { display: block; width: 100%; height: 100%; }

        .footer { height: 140px; min-height: 140px; background: var(--panel); border-top: 1px solid var(--border); padding: 10px; display: flex; gap: 10px; overflow-x: auto; flex-shrink: 0; z-index: 30; }
        .card { flex: 1; min-width: 160px; border: 1px solid var(--border); border-radius: 4px; padding: 5px 10px; background: rgba(0,0,0,0.02); display: flex; flex-direction: column; overflow: hidden; }
        .card-content { flex: 1; overflow-y: auto; }
        .card-t { font-size: 12px; font-weight: bold; color: var(--primary); border-bottom: 1px dashed #ccc; margin-bottom: 5px; flex-shrink: 0;}
        .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 2px; }
        .val { font-weight: bold; font-family: monospace; }

        .sec-title { font-size: 13px; font-weight: bold; border-left: 3px solid var(--primary); padding-left: 6px; margin: 10px 0 5px 0; color: var(--text); }
        .in-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 12px; }
        input[type=number], select, input[type=text] { width: 90px; text-align: right; padding: 2px; border: 1px solid #ccc; border-radius: 3px; background: var(--panel); color: var(--text); }
        input[type=file] { width: 100%; font-size: 11px; }
        input[type=checkbox], input[type=radio] { cursor: pointer; }
        
        .btn-grp { display: flex; gap: 5px; margin-top: 10px; }
        button.act-btn { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; font-size: 12px; transition: 0.2s; }
        .bg-blue { background: var(--primary); } .bg-green { background: #28a745; } .bg-accent { background: var(--accent); } .bg-gray { background: #666; }
        button.act-btn:hover { filter: brightness(1.1); }

        .overlay { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); padding: 5px 15px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 50; border: 1px solid #ccc; display: flex; gap:10px; }
        .overlay button { background:none; border:none; cursor:pointer; font-weight:bold; color:#333; font-size:13px; }
        .map-box { background: rgba(0,122,204,0.05); padding: 5px; border: 1px solid var(--primary); border-radius: 4px; margin-bottom: 5px; }
    </style>
</head>
<body data-theme="light">

    <div class="header">
        <span>Wafer Viewer v61 <span style="font-size:11px; background:var(--accent); color:white; padding:2px 5px; border-radius:3px;">Export Anchor</span></span>
        <button onclick="document.body.setAttribute('data-theme', document.body.getAttribute('data-theme')==='light'?'dark':'light'); render();" style="background:transparent; border:1px solid #ccc; padding:2px 8px; border-radius:4px; cursor:pointer; color:inherit;">🌗</button>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="map-box">
                <div class="sec-title" style="margin-top:0;">1. 匯入 Mapping (TXT)</div>
                <input type="file" id="map-file" accept=".txt" onchange="handleMapUpload(this)">
                <div id="map-status" style="font-size:11px; margin-top:5px; color:#666;">未載入</div>
                <div class="in-row" style="margin-top:8px;">
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer; color:var(--primary); font-weight:bold;">
                        <input type="checkbox" id="auto_est" checked> 自動估算尺寸
                    </label>
                </div>
                <div class="in-row">
                    <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                        <input type="checkbox" id="map_show_text" onchange="render()"> 顯示代碼 (Text)
                    </label>
                </div>
            </div>

            <div class="sec-title">2. 晶圓參數</div>
            <div class="in-row"><label>直徑 (in)</label><input type="number" id="w_dia" value="8.0" onchange="updateGeometry()"></div>
            <div class="in-row" style="background:#e8f5e9;"><label>晶片 X (mm)</label><input type="number" id="w_dx" value="0.932" onchange="updateGeometry()"></div>
            <div class="in-row" style="background:#e8f5e9;"><label>晶片 Y (mm)</label><input type="number" id="w_dy" value="1.632" onchange="updateGeometry()"></div>
            <div class="in-row" style="background:#e8f5e9;"><label>切割道 (mm)</label><input type="number" id="w_sc" value="0.08" step="0.001" onchange="updateGeometry()"></div>
            
            <div class="sec-title">3. 顯示微調</div>
            <div class="in-row"><label>Map Shift X</label><input type="number" id="map_off_x" value="0" onchange="updateGeometry()"></div>
            <div class="in-row"><label>Map Shift Y</label><input type="number" id="map_off_y" value="0" onchange="updateGeometry()"></div>
            <div class="in-row"><label>線條粗細</label><input type="number" id="v_stroke" value="0.02" step="0.01" onchange="render()"></div>
            
            <div class="in-row" style="justify-content: flex-start; gap: 10px; margin-top:8px;">
                <label style="font-size:12px; cursor:pointer;"><input type="radio" name="align_visual" value="die" checked onchange="updateGeometry()"> 晶片中心</label>
                <label style="font-size:12px; cursor:pointer;"><input type="radio" name="align_visual" value="scribe" onchange="updateGeometry()"> 切割道中心</label>
            </div>

            <div class="map-box" style="border-color:var(--accent); background:rgba(0, 150, 136, 0.05); margin-top:15px;">
                <div class="sec-title" style="margin-top:0; color:var(--accent);">4. 最小外接圓 (SEC)</div>
                <div class="in-row"><label>Center X:</label><span id="calc_cx" class="val">0.00</span></div>
                <div class="in-row"><label>Center Y:</label><span id="calc_cy" class="val">0.00</span></div>
                <div class="in-row"><label>Radius:</label><span id="calc_r" class="val">0.00</span></div>
                <button class="act-btn bg-accent" style="width:100%; margin-top:5px;" onclick="updateGeometry()">⟳ 重新計算圓心</button>
            </div>

            <div class="sec-title" style="border-color:#e91e63;">5. 匯出設定 (CSV)</div>
            <div class="in-row">
                <label>全域原點:</label>
                <select id="csv_global_origin">
                    <option value="center">Wafer Center (0,0)</option>
                    <option value="ref_r">Leftmost 'R' (0,0)</option>
                </select>
            </div>
            <div class="in-row">
                <label>參考點位置:</label>
                <select id="csv_die_anchor" style="font-weight:bold; color:#007ACC;">
                    <option value="center">晶片中心 (Center)</option>
                    <option value="TL">左上 (Top-Left)</option>
                    <option value="TR">右上 (Top-Right)</option>
                    <option value="BL">左下 (Bot-Left)</option>
                    <option value="BR">右下 (Bot-Right)</option>
                </select>
            </div>

            <div class="btn-grp" style="margin-top:20px;">
                <button class="act-btn bg-blue" onclick="dlSVG()">下載 SVG</button>
                <button class="act-btn bg-green" onclick="dlCSV()">匯出 CSV</button>
            </div>
        </div>

        <div class="right-panel">
            <div id="canvas-wrapper">
                <canvas id="mainCanvas"></canvas>
                <div class="overlay">
                    <button onclick="autoFit()">⛶ Auto Fit</button>
                </div>
            </div>

            <div class="footer">
                <div class="card">
                    <div class="card-t">邊界分析 (Boundary)</div>
                    <div class="row"><span>8吋標準圓:</span><span class="val" id="res_dia">200.00</span></div>
                    <div class="row"><span>最小外接圓:</span><span class="val" id="res_outer">0.00</span></div>
                    <div class="row" style="color:red;"><span>內縮 Margin:</span><span class="val" id="res_margin">0.00</span></div>
                </div>
                <div class="card" style="flex:2;">
                    <div class="card-t">數量統計 (Dynamic)</div>
                    <div class="card-content" id="stats_container"><div style="font-size:11px; color:#888;">請匯入...</div></div>
                </div>
                <div class="card">
                    <div class="card-t">圖例</div>
                    <div class="row"><span style="color:#4caf50">■ X: Good</span></div>
                    <div class="row"><span style="color:#ff9800">■ ID: Edge</span></div>
                    <div class="row"><span style="color:#009688">■ O: SEC</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 全域變數 ---
        let waferMap = null; 
        let dieList = []; // 已經計算好物理座標(中心點)的晶片列表
        let view = { x: 0, y: 0, s: 1.0, panX: 0, panY: 0 };
        let isPan = false, startX = 0, startY = 0;
        let canvas, ctx;
        
        let geometryResult = {
            centerX: 0, centerY: 0, radius: 0,
            valid: false, counts: {}, edgeDies: []
        };

        window.onload = () => {
            initCanvas();
            setTimeout(() => { autoFit(); render(); }, 200);
        };

        function getVal(id) { 
            const el = document.getElementById(id);
            if(!el) return 0;
            const val = parseFloat(el.value);
            if(id.startsWith('w_') && id!=='w_sc') return Math.max(0.001, val || 0); 
            return val || 0; 
        }

        // --- Canvas ---
        function initCanvas() {
            canvas = document.getElementById('mainCanvas');
            ctx = canvas.getContext('2d');
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left, my = e.clientY - rect.top;
                const zoom = e.deltaY > 0 ? 0.9 : 1.1;
                const worldX = (mx - view.panX) / view.s;
                const worldY = (my - view.panY) / view.s;
                view.s *= zoom;
                view.panX = mx - worldX * view.s;
                view.panY = my - worldY * view.s;
                render(); 
            });

            canvas.addEventListener('mousedown', e => {
                if(e.button===0 || e.button===1) { isPan = true; startX = e.clientX; startY = e.clientY; canvas.style.cursor = 'grabbing'; }
            });
            window.addEventListener('mousemove', e => {
                if(isPan) { view.panX += e.clientX - startX; view.panY += e.clientY - startY; startX = e.clientX; startY = e.clientY; render(); }
            });
            window.addEventListener('mouseup', () => { isPan = false; canvas.style.cursor = 'default'; });
        }

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            render();
        }

        function autoFit() {
            const dia = getVal('w_dia') * 25.4 || 200;
            const margin = 1.1; 
            const minDim = Math.min(canvas.width, canvas.height);
            view.s = minDim / (dia * margin);
            view.panX = canvas.width / 2;
            view.panY = canvas.height / 2;
            render();
        }

        // --- 檔案處理 ---
        function handleMapUpload(input) {
            const file = input.files[0];
            if(!file) return;
            const r = new FileReader();
            r.onload = e => { 
                const result = parseMap(e.target.result); 
                if(result.rows > 0) {
                    document.getElementById('map-status').innerText = `Loaded: ${file.name}`;
                    document.getElementById('map-status').style.color = "green";
                    document.getElementById('map_off_x').value = 0;
                    document.getElementById('map_off_y').value = 0;
                    if(document.getElementById('auto_est').checked) estimateWaferParams(result.rows, result.cols);
                    
                    updateGeometry(); 
                    setTimeout(autoFit, 50); 
                } else { alert("解析失敗"); }
            };
            r.readAsText(file);
        }

        function parseMap(text) {
            const lines = text.split(/\r?\n/);
            let data = {};
            let minR=Infinity, maxR=-Infinity, minC=Infinity, maxC=-Infinity, count=0;
            lines.forEach((line, r) => {
                if(!line) return;
                for(let c=0; c<line.length; c++) {
                    const char = line[c];
                    if(char !== '\r' && char !== '\n') {
                        data[`${r},${c}`] = char;
                        if (char !== ' ') { 
                            if(r<minR) minR=r; if(r>maxR) maxR=r;
                            if(c<minC) minC=c; if(c>maxC) maxC=c;
                            count++;
                        }
                    }
                }
            });
            if(count>0) {
                waferMap = { data, centerR: (minR+maxR)/2, centerC: (minC+maxC)/2, minR, maxR, minC, maxC };
                return { rows: maxR - minR + 1, cols: maxC - minC + 1 };
            }
            return { rows: 0, cols: 0 };
        }

        function estimateWaferParams(rows, cols) {
            const dia = getVal('w_dia') * 25.4; 
            const scribe = 0.08; 
            const pitchX = dia / cols, pitchY = dia / rows;
            document.getElementById('w_dx').value = Math.max(0.1, pitchX - scribe).toFixed(3);
            document.getElementById('w_dy').value = Math.max(0.1, pitchY - scribe).toFixed(3);
            document.getElementById('w_sc').value = scribe;
        }

        // === 幾何計算核心 ===
        function updateGeometry() {
            if (!waferMap) return;

            const dx = getVal('w_dx'), dy = getVal('w_dy'), sc = getVal('w_sc');
            const px = dx+sc, py = dy+sc;
            const mapOffX = getVal('map_off_x'), mapOffY = getVal('map_off_y');
            const alignMode = document.querySelector('input[name="align_visual"]:checked').value;
            const shiftX = (alignMode === 'scribe') ? px/2 : 0;
            const shiftY = (alignMode === 'scribe') ? py/2 : 0;

            dieList = [];
            let counts = {};
            let pointsForCircle = []; 

            const rStart = waferMap.minR, rEnd = waferMap.maxR;
            const cStart = waferMap.minC, cEnd = waferMap.maxC;
            const hx = dx/2, hy = dy/2;

            for(let r = rStart; r <= rEnd; r++) {
                for(let c = cStart; c <= cEnd; c++) {
                    const char = waferMap.data[`${r},${c}`];
                    if (!char || char === ' ' || char === '\r') continue;

                    const i = c - waferMap.centerC + mapOffX;
                    const j = r - waferMap.centerR + mapOffY;
                    const cx = (i * px) + shiftX;
                    const cy = (j * py) + shiftY;

                    if (!counts[char]) counts[char] = 0; counts[char]++;

                    let fill = null, strokeColor = "rgba(0,120,215,0.3)";
                    if (char === 'X') { fill="#4caf50"; strokeColor="#4caf50"; }
                    else if (char === '1') { fill="#f44336"; strokeColor="#f44336"; }
                    else if (char === 'R') { fill="#2196f3"; strokeColor="#2196f3"; }
                    else { fill="#9e9e9e"; strokeColor="#999"; }
                    
                    if(fill.startsWith('#')) {
                        let r = parseInt(fill.slice(1,3), 16), g = parseInt(fill.slice(3,5), 16), b = parseInt(fill.slice(5,7), 16);
                        fill = `rgba(${r},${g},${b},0.4)`;
                    }

                    dieList.push({ r, c, cx, cy, code: char, fill, strokeColor });

                    if (char !== '1') {
                        pointsForCircle.push({x: cx - hx, y: cy - hy});
                        pointsForCircle.push({x: cx + hx, y: cy - hy});
                        pointsForCircle.push({x: cx + hx, y: cy + hy});
                        pointsForCircle.push({x: cx - hx, y: cy + hy});
                    }
                }
            }

            // 識別外圈
            const dieSet = new Set(dieList.map(d => `${d.r},${d.c}`));
            let edgeDies = [];
            dieList.forEach(d => {
                const neighbors = [`${d.r-1},${d.c}`, `${d.r+1},${d.c}`, `${d.r},${d.c-1}`, `${d.r},${d.c+1}`];
                if(neighbors.some(n => !dieSet.has(n)) && d.code !== '1') { 
                    d.isEdge = true; edgeDies.push(d);
                }
            });

            // 計算最小外接圓
            let circle = makeMinCircle(pointsForCircle);
            
            // 順時針排序外圈
            if (circle) {
                edgeDies.sort((a, b) => {
                    let angA = Math.atan2(a.cx - circle.x, -(a.cy - circle.y)); if (angA < 0) angA += 2 * Math.PI;
                    let angB = Math.atan2(b.cx - circle.x, -(b.cy - circle.y)); if (angB < 0) angB += 2 * Math.PI;
                    return angA - angB;
                });
            }
            edgeDies.forEach((d, idx) => {
                d.edgeID = (idx + 1).toString().padStart(4, '0');
            });

            geometryResult = {
                centerX: circle ? circle.x : 0,
                centerY: circle ? circle.y : 0,
                radius: circle ? circle.r : 0,
                valid: !!circle,
                counts: counts,
                edgeDies: edgeDies
            };

            document.getElementById('calc_cx').innerText = geometryResult.centerX.toFixed(2);
            document.getElementById('calc_cy').innerText = geometryResult.centerY.toFixed(2);
            document.getElementById('calc_r').innerText = geometryResult.radius.toFixed(2);
            
            const dia = getVal('w_dia') * 25.4;
            const margin = (dia/2) - geometryResult.radius;
            document.getElementById('res_dia').innerText = dia.toFixed(2);
            document.getElementById('res_outer').innerText = (geometryResult.radius*2).toFixed(2);
            document.getElementById('res_margin').innerText = margin.toFixed(2);
            
            updateDynamicStats(counts);
            render(); 
        }

        // --- Welzl's Algorithm ---
        function makeMinCircle(points) {
            if (points.length === 0) return null;
            for (let i = points.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [points[i], points[j]] = [points[j], points[i]];
            }
            let circle = null;
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                if (!circle || !isInside(circle, p)) {
                    circle = makeCircleOnePoint(points.slice(0, i + 1), p);
                }
            }
            return circle;
        }
        function makeCircleOnePoint(points, p) {
            let c = {x: p.x, y: p.y, r: 0};
            for(let i=0; i<points.length; i++) {
                let q = points[i];
                if(!isInside(c, q)) {
                    c = makeCircleTwoPoints(p, q);
                    c = makeCircleTwoPointsBoundary(points.slice(0, i), p, q);
                }
            }
            return c;
        }
        function makeCircleTwoPointsBoundary(points, p, q) {
            let c = makeCircleTwoPoints(p, q);
            for(let i=0; i<points.length; i++) {
                let r = points[i];
                if(!isInside(c, r)) {
                    c = makeCircleThreePoints(p, q, r);
                }
            }
            return c;
        }
        function makeCircleTwoPoints(p1, p2) {
            const x = (p1.x + p2.x) / 2;
            const y = (p1.y + p2.y) / 2;
            const r = Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2)) / 2;
            return { x, y, r };
        }
        function makeCircleThreePoints(p1, p2, p3) {
            const x1 = p1.x, y1 = p1.y, x2 = p2.x, y2 = p2.y, x3 = p3.x, y3 = p3.y;
            const D = 2 * (x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2));
            if (Math.abs(D) < 1e-6) return makeCircleTwoPoints(p1, p2);
            const centerX = ((x1*x1 + y1*y1) * (y2 - y3) + (x2*x2 + y2*y2) * (y3 - y1) + (x3*x3 + y3*y3) * (y1 - y2)) / D;
            const centerY = ((x1*x1 + y1*y1) * (x3 - x2) + (x2*x2 + y2*y2) * (x1 - x3) + (x3*x3 + y3*y3) * (x2 - x1)) / D;
            const r = Math.sqrt(Math.pow(centerX - x1, 2) + Math.pow(centerY - y1, 2));
            return { x: centerX, y: centerY, r: r };
        }
        function isInside(c, p) {
            return Math.sqrt(Math.pow(p.x - c.x, 2) + Math.pow(p.y - c.y, 2)) <= c.r + 1e-4;
        }

        // === 繪圖 ===
        function render() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fafafa"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.translate(view.panX, view.panY);
            ctx.scale(view.s, view.s);

            const stk = getVal('v_stroke');
            const dx = getVal('w_dx'), dy = getVal('w_dy');
            const lineWidth = Math.max(stk / view.s, 0.5 / view.s);
            const showText = document.getElementById('map_show_text').checked;
            ctx.lineWidth = lineWidth;

            // 1. 座標軸 & 標準圓 (使用計算出的圓心)
            ctx.strokeStyle = "#ccc";
            ctx.beginPath(); ctx.moveTo(-1000, 0); ctx.lineTo(1000, 0); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -1000); ctx.lineTo(0, 1000); ctx.stroke();

            const dia = getVal('w_dia')*25.4;
            
            // 藍色實線圓：以計算出的 MEC 圓心為準 (因為要看 Margin，必須同心比較)
            // 或者是晶圓幾何中心？
            // 根據需求：Margin = 標準圓 - 包絡圓。為了視覺比較，通常將兩圓同心繪製。
            const drawCx = geometryResult.valid ? geometryResult.centerX : 0;
            const drawCy = geometryResult.valid ? geometryResult.centerY : 0;

            ctx.strokeStyle = "#2196f3"; ctx.lineWidth = lineWidth * 1.5;
            ctx.beginPath(); 
            ctx.arc(drawCx, drawCy, dia/2, 0, Math.PI*2); 
            ctx.stroke();

            // 2. 晶片
            dieList.forEach(d => {
                if (d.fill) { ctx.fillStyle = d.fill; ctx.fillRect(d.cx - dx/2, d.cy - dy/2, dx, dy); }
                ctx.strokeStyle = d.strokeColor;
                
                if (d.isEdge) ctx.lineWidth = lineWidth * 2;
                else ctx.lineWidth = lineWidth;
                
                if (d.isEdge) ctx.strokeStyle = "#ff9800"; 

                ctx.strokeRect(d.cx - dx/2, d.cy - dy/2, dx, dy);

                if (showText && dx * view.s > 8) {
                    ctx.save(); ctx.translate(d.cx, d.cy);
                    let scaleF = (Math.min(dx, dy) * 0.6) / 10; ctx.scale(scaleF, scaleF);
                    ctx.font = "bold 10px sans-serif";
                    let txt = d.code; ctx.fillStyle = "#000";
                    if (d.isEdge) { txt = d.edgeID; ctx.fillStyle = "#d84315"; }
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(txt, 0, 0);
                    ctx.restore();
                }
            });

            // 3. 最小外接圓 (紅色虛線)
            if (geometryResult.valid) {
                ctx.strokeStyle = "#009688"; ctx.lineWidth = lineWidth * 1.5;
                ctx.setLineDash([5/view.s, 5/view.s]);
                ctx.beginPath(); 
                ctx.arc(geometryResult.centerX, geometryResult.centerY, geometryResult.radius, 0, Math.PI*2); 
                ctx.stroke();
                ctx.setLineDash([]);

                const cs = 10 / view.s;
                ctx.beginPath();
                ctx.moveTo(geometryResult.centerX - cs, geometryResult.centerY); ctx.lineTo(geometryResult.centerX + cs, geometryResult.centerY);
                ctx.moveTo(geometryResult.centerX, geometryResult.centerY - cs); ctx.lineTo(geometryResult.centerX, geometryResult.centerY + cs);
                ctx.stroke();
            }
        }

        function updateDynamicStats(counts) {
            const container = document.getElementById('stats_container');
            if (Object.keys(counts).length === 0) { container.innerHTML = '<div style="font-size:11px; color:#888;">無資料</div>'; return; }
            let html = '';
            Object.keys(counts).sort().forEach(k => {
                let c = '#333'; if(k==='X') c='#4caf50'; else if(k==='1') c='#f44336';
                html += `<div class="row" style="color:${c}"><span>■ ${k}:</span><span class="val">${counts[k]}</span></div>`;
            });
            container.innerHTML = html;
        }

        function dlCSV() {
            const anchorMode = document.getElementById('csv_die_anchor').value;
            const globalOrigin = document.getElementById('csv_global_origin').value;
            const dx = getVal('w_dx'), dy = getVal('w_dy');
            
            let globalOffX = 0, globalOffY = 0;
            
            // 尋找 Global Origin 偏移量
            if (globalOrigin === 'ref_r') {
                // 尋找最左邊 'R' (這裡暫時寫死代碼R，若需動態可加Input)
                let targetR = null;
                dieList.forEach(d => {
                    if (d.code === 'R') {
                        if (!targetR) targetR = d;
                        else if (d.c < targetR.c || (d.c === targetR.c && d.r < targetR.r)) targetR = d;
                    }
                });
                if (targetR) { globalOffX = targetR.cx; globalOffY = targetR.cy; }
                else { alert("找不到 'R'，使用圓心 (0,0)"); }
            }

            let txt = "Edge_ID,Row,Col,X,Y,Code\n";
            const hw = dx/2, hh = dy/2;

            dieList.forEach(d => {
                let outX = d.cx - globalOffX;
                let outY = d.cy - globalOffY;

                // 根據錨點調整
                switch(anchorMode) {
                    case 'TL': outX -= hw; outY -= hh; break;
                    case 'TR': outX += hw; outY -= hh; break;
                    case 'BL': outX -= hw; outY += hh; break;
                    case 'BR': outX += hw; outY += hh; break;
                }

                let idStr = d.isEdge ? d.edgeID : "";
                txt += `${idStr},${d.r},${d.c},${outX.toFixed(3)},${outY.toFixed(3)},${d.code}\n`;
            });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([txt],{type:'text/csv'}));
            a.download = `wafer_data.csv`; a.click();
        }
        function dlSVG() { alert("SVG 下載僅包含基礎圖形"); }
    </script>
