<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wafer Tool v45 (Text Toggle)</title>
    <style>
        /* --- 基礎樣式 --- */
        :root {
            --bg-body: #f4f4f9; --panel: #fff; --text: #333; --border: #ccc;
            --primary: #007ACC; --accent: #ff9800; --canvas: #fff;
        }
        [data-theme="dark"] {
            --bg-body: #1e1e1e; --panel: #2d2d2d; --text: #eee; --border: #444;
            --primary: #4fc3f7; --accent: #ffb74d; --canvas: #121212;
        }
        body { font-family: "Segoe UI", sans-serif; background: var(--bg-body); color: var(--text); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { height: 40px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 15px; font-weight: bold; flex-shrink: 0; justify-content: space-between; }
        
        .container { display: flex; flex: 1; height: calc(100vh - 40px); }
        .sidebar { width: 400px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 10px; overflow-y: auto; gap: 10px; flex-shrink: 0; z-index: 20; }
        .right-panel { flex: 1; display: flex; flex-direction: column; background: #ddd; position: relative; min-width: 0; }
        
        .canvas-area {
            flex: 1; position: relative; overflow: hidden; cursor: default;
            background: var(--canvas);
        }
        #world {
            position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            transform-origin: 0 0; will-change: transform; overflow: visible;
        }
        .layer { position: absolute; top: 0; left: 0; overflow: visible; }
        #layer-video { transform: translate(-50%, -50%); opacity: 0.5; pointer-events: none; display: none; }
        #layer-draw { pointer-events: visiblePainted; z-index: 10; }

        .footer {
            height: 140px; background: var(--panel); border-top: 1px solid var(--border);
            padding: 10px; display: flex; gap: 10px; overflow-x: auto; flex-shrink: 0; z-index: 30;
        }
        .card {
            flex: 1; min-width: 140px; border: 1px solid var(--border); border-radius: 4px; padding: 5px 10px;
            background: rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: center;
        }
        .card-t { font-size: 12px; font-weight: bold; color: var(--primary); border-bottom: 1px dashed #ccc; margin-bottom: 5px; }
        .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 2px; }
        .val { font-weight: bold; font-family: monospace; }

        .sec-title { font-size: 13px; font-weight: bold; border-left: 3px solid var(--primary); padding-left: 6px; margin: 10px 0 5px 0; color: var(--text); }
        .in-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 12px; }
        input[type=number], select { width: 90px; text-align: right; padding: 2px; border: 1px solid #ccc; border-radius: 3px; background: var(--panel); color: var(--text); }
        input[type=range] { flex: 1; margin-left: 5px; }
        input[type=file] { width: 100%; font-size: 11px; }
        input[type=checkbox] { cursor: pointer; }
        
        .mode-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .tab { padding: 8px; text-align: center; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-grp { display: flex; gap: 5px; margin-top: 10px; }
        button.act-btn { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; font-size: 12px; transition: 0.2s; }
        .bg-blue { background: var(--primary); } .bg-green { background: #28a745; } .bg-red { background: #dc3545; } .bg-gray { background: #666; }
        button.act-btn:hover { filter: brightness(1.1); }

        .overlay { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); padding: 5px 15px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 50; border: 1px solid #ccc; display: flex; gap:10px; }
        .help-box { position: absolute; bottom: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px; font-size: 11px; z-index: 50; display: none; border: 1px solid #ccc; color:#333; box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
        
        .g-param { display: none; }
        .map-box { background: rgba(0,122,204,0.05); padding: 5px; border: 1px solid var(--primary); border-radius: 4px; margin-bottom: 5px; }
        
        .st-x { color: #4caf50; font-weight: bold; }
        .st-1 { color: #f44336; font-weight: bold; }
        .st-r { color: #2196f3; font-weight: bold; }
        
        path, line, circle, rect, text { vector-effect: non-scaling-stroke; }
        text { font-family: monospace; font-weight: bold; pointer-events: none; user-select: none; }
    </style>
</head>
<body data-theme="light">

    <div class="header">
        <span>Wafer Tool v45 <span style="font-size:11px; background:var(--primary); color:white; padding:2px 5px; border-radius:3px;">Text Toggle</span></span>
        <button onclick="document.body.setAttribute('data-theme', document.body.getAttribute('data-theme')==='light'?'dark':'light')" style="background:transparent; border:1px solid #ccc; padding:2px 8px; border-radius:4px; cursor:pointer; color:inherit;">🌗</button>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="mode-tabs">
                <div class="tab active" id="tab-1" onclick="setMode(1)">1. 晶圓 (Auto)</div>
                <div class="tab" id="tab-2" onclick="setMode(2)">2. 手繪 (AR)</div>
            </div>

            <div id="common-ui">
                <div class="sec-title">全域參數</div>
                <div class="in-row"><label>線條粗細</label><input type="number" id="v_stroke" value="1.0" step="0.1" onchange="render()"></div>
                <div class="in-row"><label>Offset X (um)</label><input type="number" id="off_x" value="0" onchange="render()"></div>
                <div class="in-row"><label>Offset Y (um)</label><input type="number" id="off_y" value="0" onchange="render()"></div>
                <div class="in-row"><label>作業速 (mm/s)</label><input type="number" id="spd_w" value="30" onchange="render()"></div>
                <div class="in-row"><label>快移速 (mm/s)</label><input type="number" id="spd_j" value="50" onchange="render()"></div>
                <div class="in-row"><label>加減速 (s)</label><input type="number" id="t_acc" value="0.017" step="0.001" onchange="render()"></div>
            </div>

            <div id="p-m1" class="g-param" style="display:block;">
                <div class="sec-title">晶圓設定</div>
                
                <div class="map-box">
                    <div style="font-weight:bold; font-size:12px; margin-bottom:3px;">Mapping (TXT)</div>
                    <input type="file" id="map-file" accept=".txt" onchange="handleMapUpload(this)">
                    <div id="map-status" style="font-size:11px; margin-top:2px; color:#666;">未載入</div>
                    
                    <div class="in-row" style="margin-top:5px;"><label>Map Off X</label><input type="number" id="map_off_x" value="0" onchange="render()"></div>
                    <div class="in-row"><label>Map Off Y</label><input type="number" id="map_off_y" value="0" onchange="render()"></div>
                    
                    <div class="in-row" style="margin-top:5px;">
                        <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                            <input type="checkbox" id="map_show_text" onchange="render()"> 
                            顯示代碼 (Show Text)
                        </label>
                    </div>
                </div>

                <div class="in-row"><label>直徑 (in)</label><input type="number" id="w_dia" value="8.0" onchange="render()"></div>
                <div class="in-row"><label>內縮 (mm)</label><input type="number" id="w_margin" value="5.0" onchange="render()"></div>
                <div class="in-row" style="background:#e8f5e9;"><label>晶片 X</label><input type="number" id="w_dx" value="1.645" onchange="render()"></div>
                <div class="in-row" style="background:#e8f5e9;"><label>晶片 Y</label><input type="number" id="w_dy" value="0.945" onchange="render()"></div>
                <div class="in-row" style="background:#e8f5e9;"><label>切割道</label><input type="number" id="w_sc" value="0.08" step="0.001" onchange="render()"></div>
                
                <div class="sec-title">路徑策略</div>
                <div class="in-row"><label>起點</label><select id="m1_corn" onchange="render()"><option value="tl">TL</option><option value="tr">TR</option><option value="bl">BL</option><option value="br">BR</option></select></div>
                <div class="in-row"><label>方式</label><select id="m1_trav" onchange="render()"><option value="snake">Snake</option><option value="jump">Jump</option><option value="jumpsnake">J-Snake</option></select></div>
                <div class="in-row" style="margin-top:5px; background:#e3f2fd; padding:5px;"><label>有效晶片:</label><span id="m1_cnt" style="font-weight:bold; color:blue;">0</span></div>
            </div>

            <div id="p-m2" class="g-param">
                <div class="sec-title">手繪 AR</div>
                <div class="in-row"><label>Webcam</label><span><button class="act-btn bg-green" style="padding:2px 8px;" onclick="startCam()">ON</button> <button class="act-btn bg-red" style="padding:2px 8px;" onclick="stopCam()">OFF</button></span></div>
                <div class="in-row"><label>透明度</label><input type="range" id="m2_op" min="0" max="1" step="0.1" value="0.5" oninput="updCam()"></div>
                <div class="in-row"><label>校正 (Px/mm)</label><input type="number" id="m2_sc" value="10" onchange="renderManual()"></div>
                <div class="in-row"><label><input type="checkbox" id="m2_gen" checked onchange="renderManual()"> 網格</label><input type="number" id="m2_gp" value="10" style="width:50px;" onchange="renderManual()"></div>
                <div class="in-row"><label><input type="checkbox" id="m2_ortho"> 正交 (Shift)</label></div>
                <div class="in-row"><label>動作</label><select id="m2_type"><option value="1">Disp</option><option value="0">Move</option><option value="2">Jump</option></select></div>
                <button class="act-btn bg-red" style="width:100%; margin-top:5px;" onclick="clearManual()">Clear</button>
            </div>

            <div class="btn-grp">
                <button class="act-btn bg-blue" onclick="dlSVG()">SVG</button>
                <button class="act-btn bg-green" onclick="dlCSV()">CSV</button>
            </div>
        </div>

        <div class="right-panel">
            <div id="canvas-window">
                <div class="overlay">
                    <button style="background:none; border:none; cursor:pointer; color:#333; font-weight:bold;" onclick="render(); view={x:0,y:0,s:1}; updWorld();">🔄 Reset View</button>
                </div>

                <div id="world">
                    <video id="layer-video" autoplay playsinline class="layer" muted></video>
                    <svg id="layer-grid" class="layer" width="0" height="0" style="overflow:visible; pointer-events:none;">
                        <defs><pattern id="gridPat" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ccc" stroke-width="1"/></pattern></defs>
                        <rect x="-50000" y="-50000" width="100000" height="100000" fill="url(#gridPat)"/>
                    </svg>
                    <svg id="layer-draw" class="layer" width="0" height="0" style="overflow:visible;"></svg>
                </div>

                <div class="help-box" id="manual-help">
                    <b>手繪操作:</b><br>
                    左鍵: 新增<br>右鍵: 刪除<br>滾輪: 縮放<br>中鍵: 平移
                </div>
            </div>

            <div class="footer">
                <div class="card">
                    <div class="card-t">總覽 (Totals)</div>
                    <div class="row"><span>距離:</span><span class="val" id="res_dist">0.00 m</span></div>
                    <div class="row"><span>時間:</span><span class="val" id="res_time_s">0.00 s</span></div>
                    <div class="row"><span>線段:</span><span class="val" id="res_segs">0</span></div>
                </div>
                <div class="card" id="die-stats" style="background:#fff3e0; display:none;">
                    <div class="card-t">晶片數量</div>
                    <div class="row st-x"><span>■ 有效 (X):</span><span class="val" id="stat_good_x">0</span></div>
                    <div class="row st-1"><span>■ 空格 (1):</span><span class="val" id="stat_empty_1">0</span></div>
                    <div class="row st-r"><span>■ 參考 (R):</span><span class="val" id="stat_ref_r">0</span></div>
                </div>
                <div class="card" style="flex:1.5;">
                    <div class="card-t">路徑明細</div>
                    <div class="row" style="color:#28a745;"><span>■ 噴塗 (F1)</span><span class="val" id="det_f1">0 m | 0 s</span></div>
                    <div class="row" style="color:#dc3545;"><span>■ 快移 (F2)</span><span class="val" id="det_f2">0 m | 0 s</span></div>
                    <div class="row" style="color:#666;"><span>■ 移動 (F0)</span><span class="val" id="det_f0">0 m | 0 s</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Core Variables ---
        let mode = 1;
        let pathData = []; // {x, y, f}
        let manPts = [];
        let waferMap = null; 
        
        let view = { x: 0, y: 0, s: 1.0 }; 
        let isPan = false, startX = 0, startY = 0;
        let drag = { active: false, idx: -1 };
        let stream = null;

        window.onload = () => {
            initEvents();
            setMode(1);
            setTimeout(() => { updWorld(); render(); }, 100);
        };

        function getVal(id) { 
            const el = document.getElementById(id);
            if(!el) return 0;
            return parseFloat(el.value) || 0; 
        }
        function getStr(id) {
            const el = document.getElementById(id);
            return el ? el.value : "";
        }

        function setMode(id) {
            mode = id;
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            
            document.getElementById('p-m1').style.display = (id===1)?'block':'none';
            document.getElementById('p-m2').style.display = (id===2)?'block':'none';
            
            const isMan = (id===2);
            document.getElementById('manual-help').style.display = isMan?'block':'none';
            document.getElementById('webcam-layer').style.display = isMan?'block':'none';
            document.getElementById('grid-layer').style.display = isMan?'block':'none';
            document.getElementById('die-stats').style.display = (id===1 && waferMap)?'flex':'none';

            if(isMan) { startCam(); renderManual(); }
            else { stopCam(); render(); }
            
            view = {x:0, y:0, s:1.0};
            updWorld();
        }

        // --- Mapping & Auto Estimate Logic ---
        function handleMapUpload(input) {
            const file = input.files[0];
            if(!file) return;
            const r = new FileReader();
            r.onload = e => { 
                const result = parseMap(e.target.result); 
                document.getElementById('map-status').innerText = `已載入 (${result.rows}x${result.cols})`;
                document.getElementById('map-status').style.color = "green";
                estimateWaferParams(result.rows, result.cols);
                document.getElementById('die-stats').style.display = 'flex';
                render(); 
            };
            r.readAsText(file);
        }

        function parseMap(text) {
            const lines = text.split(/\r?\n/);
            let data = {};
            let minR=Infinity, maxR=-Infinity, minC=Infinity, maxC=-Infinity;
            let count=0;
            
            lines.forEach((line, r) => {
                if(!line) return;
                for(let c=0; c<line.length; c++) {
                    const char = line[c];
                    if(char !== '\r' && char !== '\n') {
                        data[`${r},${c}`] = char;
                        if (char !== ' ') { 
                            if(r<minR) minR=r; if(r>maxR) maxR=r;
                            if(c<minC) minC=c; if(c>maxC) maxC=c;
                            count++;
                        }
                    }
                }
            });
            
            if(count>0) {
                waferMap = { data, centerR: (minR+maxR)/2, centerC: (minC+maxC)/2 };
                return { rows: maxR - minR + 1, cols: maxC - minC + 1 };
            }
            return { rows: 0, cols: 0 };
        }

        function estimateWaferParams(rows, cols) {
            if(rows <= 0 || cols <= 0) return;
            const dia = getVal('w_dia') * 25.4; 
            const margin = getVal('w_margin');
            const effDia = dia - (2 * margin);
            if(effDia <= 0) return;

            const scribe = 0.08; 
            const pitchX = effDia / cols;
            const pitchY = effDia / rows;
            const estDieW = Math.max(0.1, pitchX - scribe);
            const estDieH = Math.max(0.1, pitchY - scribe);

            document.getElementById('w_dx').value = estDieW.toFixed(3);
            document.getElementById('w_dy').value = estDieH.toFixed(3);
            document.getElementById('w_sc').value = scribe;
        }

        // --- Viewport Events ---
        function initEvents() {
            const win = document.getElementById('canvas-window');
            win.addEventListener('wheel', e => {
                e.preventDefault();
                const d = e.deltaY > 0 ? 0.9 : 1.1;
                view.s *= d;
                updWorld();
                if(mode===2) renderManual();
            });
            win.addEventListener('mousedown', e => {
                if(e.button===1 || (e.button===0 && e.ctrlKey)) {
                    isPan=true; startX=e.clientX; startY=e.clientY; win.style.cursor='grabbing'; e.preventDefault();
                } else if(e.button===0 && mode===2) onManDown(e);
            });
            window.addEventListener('mousemove', e => {
                if(isPan) {
                    view.x += (e.clientX - startX); view.y += (e.clientY - startY);
                    startX = e.clientX; startY = e.clientY; updWorld();
                } else if(mode===2 && drag.active) onManMove(e);
            });
            window.addEventListener('mouseup', () => { isPan=false; drag.active=false; win.style.cursor=(mode===2)?'crosshair':'default'; });
            win.addEventListener('contextmenu', e=>{ if(mode===2){e.preventDefault(); onManRight(e);} });
        }
        function updWorld() { 
            document.getElementById('world').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`; 
        }

        // --- Mode 1: Render ---
        function render() {
            if(mode===2) { renderManual(); return; }
            const svg = document.getElementById('layer-draw'); svg.innerHTML='';
            const stk = getVal('v_stroke');
            const ox = getVal('off_x')/1000, oy = getVal('off_y')/1000;

            // Axis
            addLn(svg, -1000, 0, 1000, 0, "#999", stk); addLn(svg, 0, -1000, 0, 1000, "#999", stk);

            const dia = getVal('w_dia')*25.4, r = (dia - getVal('w_margin'))/2;
            const dx = getVal('w_dx'), dy = getVal('w_dy'), sc = getVal('w_sc');
            const px = dx+sc, py = dy+sc;

            addCir(svg, 0, 0, dia/2, "none", "#ccc", stk);
            addCir(svg, 0, 0, r, "none", "red", stk, "5,5");

            let dies = [];
            const nx = Math.ceil(r/px), ny = Math.ceil(r/py);
            
            const mapOffX = getVal('map_off_x'), mapOffY = getVal('map_off_y');
            const showText = document.getElementById('map_show_text').checked;

            let cntX = 0, cnt1 = 0, cntR = 0;

            for(let j=-ny; j<=ny; j++) for(let i=-nx; i<=nx; i++) {
                let cx = i*px, cy = j*py;
                // Physical Check
                if (dist(cx-dx/2,cy-dy/2)>r || dist(cx+dx/2,cy-dy/2)>r || dist(cx-dx/2,cy+dy/2)>r || dist(cx+dx/2,cy+dy/2)>r) continue;

                // Mapping Logic
                let valid = true;
                let color = "none";
                let stroke = "rgba(0,120,215,0.3)";
                let char = "";

                if (waferMap) {
                    const mr = Math.round(waferMap.centerR + j + mapOffY);
                    const mc = Math.round(waferMap.centerC + i + mapOffX);
                    char = waferMap.data[`${mr},${mc}`];

                    if (char === 'X') {
                        color = "rgba(76,175,80,0.4)"; stroke="#4caf50"; cntX++;
                    } else if (char === '1') {
                        valid = false; 
                        color = "rgba(244,67,54,0.3)"; stroke="#f44336"; cnt1++;
                    } else if (char === 'R') {
                        color = "rgba(33,150,243,0.4)"; stroke="#2196f3"; cntR++;
                    } else {
                        valid = false; color = "none"; stroke = "rgba(200,200,200,0.2)"; 
                    }
                } else {
                    stroke = "rgba(0,120,215,0.2)";
                }

                if(stroke !== "none" || color !== "none") addRect(svg, cx-dx/2, cy-dy/2, dx, dy, color, stroke, stk/2);
                
                // Show Text Code
                if (showText && char && char !== ' ') {
                    addText(svg, cx, cy, char, Math.min(dx, dy)*0.6, "#000");
                }

                if (valid) dies.push({i,j,cx,cy});
            }
            
            document.getElementById('m1_cnt').innerText = dies.length;
            document.getElementById('stat_good_x').innerText = cntX;
            document.getElementById('stat_empty_1').innerText = cnt1;
            document.getElementById('stat_ref_r').innerText = cntR;

            // Path Gen
            const corn = getStr('m1_corn');
            dies.sort((a,b)=>{
                let dY = (corn[0]==='t') ? a.j-b.j : b.j-a.j;
                if(dY!==0) return dY;
                return (corn[1]==='l') ? a.i-b.i : b.i-a.i;
            });

            pathData = [];
            let rows=[], cr=[], cj=dies[0]?.j;
            dies.forEach(d=>{ if(d.j!==cj){rows.push(cr); cr=[]; cj=d.j;} cr.push(d); });
            if(cr.length) rows.push(cr);

            const trav=getStr('m1_trav'), grp=mkGrp(svg);
            const seg=0.4; 

            rows.forEach((row, i) => {
                let isRev = (trav==='snake' && i%2!==0);
                let pRow = [...row]; if(isRev) pRow.reverse();

                if(i>0 && pathData.length>0) {
                    let last = pathData[pathData.length-1];
                    let next = pRow[0];
                    let sx = next.cx - seg/2; if(isRev) sx = next.cx + seg/2;
                    let sy = (last.y + next.cy + oy)/2;
                    if(trav==='jumpsnake') {
                        addLn(grp, last.x, last.y, last.x, sy, "red", stk, "2,1"); pathData.push({x:last.x, y:sy, f:2});
                        addLn(grp, last.x, sy, sx+ox, sy, "red", stk, "2,1"); pathData.push({x:sx+ox, y:sy, f:2});
                    }
                }

                pRow.forEach(d => {
                    let sx = d.cx - seg/2, ex = d.cx + seg/2;
                    if(isRev) { let t=sx; sx=ex; ex=t; }
                    let p1={x:sx+ox, y:d.cy+oy}, p2={x:ex+ox, y:d.cy+oy};
                    
                    if(pathData.length>0) {
                        let last = pathData[pathData.length-1];
                        if(dist(last.x-p1.x, last.y-p1.y)>0.001) {
                            addLn(grp, last.x, last.y, p1.x, p1.y, (trav==='jump'||pathData[pathData.length-1].f===2)?"red":"#999", stk, "2,1");
                            pathData.push({...p1, f:2});
                        }
                    } else pathData.push({...p1, f:2});

                    addLn(grp, p1.x, p1.y, p2.x, p2.y, "#28a745", stk);
                    pathData.push({...p2, f:1});
                });
            });
            calcStats();
        }

        // --- Mode 2: Manual ---
        async function startCam() {
             try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); 
             document.getElementById('layer-video').srcObject=stream; document.getElementById('layer-video').style.display='block'; } catch(e){}
        }
        function stopCam() { let v=document.getElementById('layer-video'); if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop()); v.style.display='none'; }
        function updCam() { document.getElementById('layer-video').style.opacity = document.getElementById('m2_op').value; }
        
        function getManPos(e) {
            const r = document.getElementById('canvas-window').getBoundingClientRect();
            const sc = getVal('m2_sc');
            const mx = e.clientX - r.left - (r.width/2); 
            const my = e.clientY - r.top - (r.height/2);
            return { x: (mx - view.x)/view.s/sc, y: (my - view.y)/view.s/sc };
        }
        function onManDown(e) {
            const m = getManPos(e);
            const hit = manPts.findIndex(p => dist(p.x-m.x, p.y-m.y) < 5/view.s);
            if(hit>=0) { drag.active=true; drag.idx=hit; }
            else {
                let pt = m;
                if(manPts.length && (e.shiftKey || document.getElementById('m2_ortho').checked)) {
                    const last = manPts[manPts.length-1];
                    if(Math.abs(m.x-last.x) > Math.abs(m.y-last.y)) pt.y=last.y; else pt.x=last.x;
                }
                manPts.push({x:pt.x, y:pt.y, f:parseInt(getStr('m2_type'))});
                renderManual();
            }
        }
        function onManMove(e) { const m=getManPos(e); manPts[drag.idx].x=m.x; manPts[drag.idx].y=m.y; renderManual(); }
        function onManRight(e) { const m=getManPos(e); const hit=manPts.findIndex(p=>dist(p.x-m.x, p.y-m.y)<5/view.s); if(hit>=0){manPts.splice(hit,1); renderManual();} }
        
        function renderManual() {
            const svg = document.getElementById('layer-draw'); svg.innerHTML='';
            const grid = document.getElementById('layer-grid');
            const sc = getVal('m2_sc'), stk = 2/view.s;

            if(document.getElementById('m2_gen').checked) {
                grid.style.display='block';
                const gp = getVal('m2_gp') * sc;
                const pat = document.getElementById('gridPat');
                if(pat) { pat.setAttribute('width', gp); pat.setAttribute('height', gp); pat.firstElementChild.setAttribute('d', `M ${gp} 0 L 0 0 0 ${gp}`); pat.firstElementChild.setAttribute('stroke-width', 1/view.s); }
            } else grid.style.display='none';

            const grp = mkGrp(svg); grp.setAttribute('transform', `scale(${sc})`);
            pathData = [];
            const ox=getVal('off_x')/1000, oy=getVal('off_y')/1000;
            
            if(manPts.length) {
                let lp=manPts[0];
                addCir(grp, lp.x, lp.y, 3/sc/view.s, "blue", "none", 0);
                pathData.push({...lp, x:lp.x+ox, y:lp.y+oy});
                for(let i=1; i<manPts.length; i++) {
                    let p=manPts[i];
                    let col = p.f===1 ? "#28a745" : (p.f===2?"#dc3545":"#999");
                    let dash = p.f!==1 ? `${5/sc/view.s},${5/sc/view.s}` : null;
                    addLn(grp, lp.x, lp.y, p.x, p.y, col, stk/sc, dash);
                    addCir(grp, p.x, p.y, 3/sc/view.s, col, "none", 0);
                    pathData.push({...p, x:p.x+ox, y:p.y+oy});
                    lp=p;
                }
            }
            calcStats();
        }
        function clearManual() { manPts=[]; renderManual(); }

        // --- Stats ---
        function calcStats() {
            let d1=0, d2=0, d0=0, cnt=0;
            if(pathData.length > 1) {
                let last=pathData[0]; d0 += dist(last.x, last.y); 
                for(let i=1; i<pathData.length; i++) {
                    let p=pathData[i], d=dist(p.x-last.x, p.y-last.y);
                    if(p.f===1) d1+=d; else if(p.f===2) d2+=d; else d0+=d;
                    last=p; cnt++;
                }
            }
            document.getElementById('res_dist').innerText = ((d1+d2+d0)/1000).toFixed(2)+" m";
            const t1 = d1/getVal('spd_w') || 0;
            const t2 = d2/getVal('spd_j') || 0;
            const t0 = d0/getVal('spd_j') || 0;
            const tAcc = cnt * getVal('t_acc');
            const total = t1+t2+t0+tAcc;
            
            document.getElementById('res_time_s').innerText = total.toFixed(2)+" s";
            document.getElementById('res_time').innerText = `${Math.floor(total/60)}:${Math.floor(total%60).toString().padStart(2,'0')}`;
            document.getElementById('res_segs').innerText = cnt;
            document.getElementById('det_f1').innerText = `${(d1/1000).toFixed(2)}m | ${t1.toFixed(1)}s`;
            document.getElementById('det_f2').innerText = `${(d2/1000).toFixed(2)}m | ${t2.toFixed(1)}s`;
            document.getElementById('det_f0').innerText = `${(d0/1000).toFixed(2)}m | ${t0.toFixed(1)}s`;
        }

        function dlCSV() {
            let txt="X,Y,Flag\n";
            pathData.forEach(p=>txt+=`${p.x.toFixed(3)},${p.y.toFixed(3)},${p.f}\n`);
            const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));
            a.download=`path.csv`; a.click();
        }
        function dlSVG() {
            let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
            const pts = (mode===2) ? manPts.map(p=>({x:p.x*getVal('m2_sc'), y:p.y*getVal('m2_sc')})) : pathData;
            if(pts.length===0) { minX=-100; maxX=100; minY=-100; maxY=100; }
            else { pts.forEach(p=>{ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }); }
            const pad=20, w=(maxX-minX)+pad*2, h=(maxY-minY)+pad*2, vb=`${minX-pad} ${minY-pad} ${w} ${h}`;
            const txt = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${document.getElementById('layer-draw').innerHTML}</svg>`;
            const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'image/svg+xml'}));
            a.download=`preview.svg`; a.click();
        }

        // --- Helpers ---
        function mkGrp(p) { const g=document.createElementNS("http://www.w3.org/2000/svg","g"); p.appendChild(g); return g; }
        function addLn(p,x1,y1,x2,y2,c,w,d) {
            const l=document.createElementNS("http://www.w3.org/2000/svg","line");
            l.setAttribute("x1",x1); l.setAttribute("y1",y1); l.setAttribute("x2",x2); l.setAttribute("y2",y2);
            l.setAttribute("stroke",c); l.setAttribute("stroke-width",w); if(d)l.setAttribute("stroke-dasharray",d);
            p.appendChild(l);
        }
        function addCir(p,x,y,r,f,s,w,d) {
            const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
            c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",r);
            c.setAttribute("fill",f); if(s)c.setAttribute("stroke",s); if(w)c.setAttribute("stroke-width",w); if(d)c.setAttribute("stroke-dasharray",d);
            p.appendChild(c);
        }
        function addRect(p,x,y,w,h,f,s,sw) {
            const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
            r.setAttribute("x",x); r.setAttribute("y",y); r.setAttribute("width",w); r.setAttribute("height",h);
            r.setAttribute("fill",f); r.setAttribute("stroke",s?s:"none"); r.setAttribute("stroke-width",sw?sw:0);
            p.appendChild(r);
        }
        function addText(p,x,y,t,s,c) {
            const el=document.createElementNS("http://www.w3.org/2000/svg","text");
            el.setAttribute("x",x); el.setAttribute("y",y); el.setAttribute("fill",c);
            el.setAttribute("font-size",s); el.setAttribute("text-anchor","middle"); el.setAttribute("dominant-baseline","middle");
            el.style.pointerEvents="none"; el.textContent=t; p.appendChild(el);
        }
        function drawAxes(p,l,w) { addLn(p,-l,0,l,0,"#aaa",w); addLn(p,0,-l,0,l,"#aaa",w); }
        function dist(dx,dy) { return Math.sqrt(dx*dx+dy*dy); }
    </script>
</body>
